# Texts the backend delivers itself: emails, notifications, PDF tickets, calendar files and scan results.
# English is the base file; messages_ru and messages_kk must have the same keys (MessageBundlesTest checks it).
# Placeholders {0}, {1}, ... are filled in by Translator, not MessageFormat: write apostrophes as they are.
# A value can't start with a space (properties trim it): start with \n or rephrase instead.

seat.label={0}, row {1}, seat {2}
common.reason=\nReason: {0}

# Account emails
account.verify.subject=Confirm your BiletFlow email address
account.verify.body=Open this link to confirm your email address:\n\n{0}\n\nThe link works once and expires in 24 hours. If you didn't create a BiletFlow account, ignore this email.
account.reset.subject=Reset your BiletFlow password
account.reset.body=Open this link to choose a new password:\n\n{0}\n\nThe link works once and expires in 1 hour. If you didn't ask for this, ignore this email; your password stays the same.

# Orders and payments
order.confirmed.title=Your tickets for {0}
order.confirmed.body=Order #{0} for "{1}" is confirmed.\n\nWhen: {2} (Almaty time)\nWhere: {3}\nTickets: {4}
order.confirmed.seats=\nSeats: {0}
order.confirmed.seatsMore=\nSeats: {0} and {1} more
order.confirmed.total=\nTotal: {0} KZT\n\nYour tickets are in your BiletFlow account, and the emailed copy of this message has them attached as a PDF, together with a calendar file (.ics) for the event.
order.confirmed.demo=\n\nThis is a demonstration payment: no real money was charged.
payment.failed.title=Payment failed for {0}
payment.declined.body=The payment for order #{0} was declined, so no tickets were issued. You can try again until the reservation expires.\n\nThis is a demonstration payment: no real money is involved.
payment.bankDeclined.body=The bank declined the payment for order #{0}, so no tickets were issued. You can try again until the reservation expires.
payment.notAccepted.title=Payment not accepted for {0}
payment.notAccepted.body=We could not accept your payment for order #{0}: {1}. No tickets were issued and the money is being returned to your card.
payment.problem.notPending=the order is no longer waiting for payment
payment.problem.expired=the order has expired
payment.problem.eventUnavailable=the event is no longer available
payment.problem.salesSuspended=paid sales for this event are suspended
payment.problem.amountMismatch=the amount paid does not match the order
payment.problem.wrongMerchant=the payment was made to a different merchant

# Refunds and cancelled registrations
refund.title=Refund for {0}
refund.body=Order #{0} for "{1}" was refunded: {2} KZT.
refund.ticketsInvalid=\n\nThe tickets of this order are no longer valid.
refund.demoNote=\n\nThis is a demonstration refund: no real money is involved.
refund.bankNote=\n\nThe money goes back to the card you paid with. Banks usually take a few working days to show it.
registration.cancelled.title=Registration cancelled for {0}
registration.cancelled.body=The organizer cancelled your registration #{0} for "{1}".
registration.cancelled.footer=\n\nIts tickets are no longer valid.

# Events
event.updated.title=Details changed for {0}
event.updated.body=The time or place of "{0}" has changed. It now takes place on {1} (Almaty time) at {2}. Your ticket stays valid. The emailed copy of this message has the updated calendar file (.ics) attached: open it to update the entry in your calendar.
event.cancelled.title={0} has been cancelled
event.cancelled.body=The organizer cancelled "{0}", so your ticket is no longer valid. You can contact the organizer by opening a support case from your order. The emailed copy of this message has a calendar file (.ics) attached that marks the event as cancelled in your calendar.
eventReport.title=Your report has been reviewed
eventReport.actioned=Thank you for reporting "{0}". Our team has reviewed it and taken action.
eventReport.dismissed=Thank you for reporting "{0}". Our team has reviewed it and found no reason to act at this time.

# Organizers and paid sales
organizer.verification.approved.title=Your organizer verification was approved
organizer.verification.approved.body=Your organizer identity verification was approved.
organizer.verification.rejected.title=Your organizer verification was rejected
organizer.verification.rejected.body=Your organizer identity verification was rejected.
organizer.verification.note=\nNote from the reviewer: {0}
paidSales.suspended.title=Paid sales suspended for {0}
paidSales.suspended.body=A platform administrator suspended paid sales for "{0}".
paidSales.suspended.footer=\nFree tickets and tickets already sold are not affected.
paidSales.restored.title=Paid sales restored for {0}
paidSales.restored.body=A platform administrator lifted the suspension of paid sales for "{0}".

# Payouts (simulated)
payout.simulationNote=\n\nThis is a simulated payout (SRS 3.2): no real money is transferred.
payout.breakdown=Ticket sales: {0} KZT\nPromo discounts: -{1} KZT\nRefunds: -{2} KZT\nProcessing fees: -{3} KZT\nPayout: {4} KZT
payout.scheduled.title=Payout scheduled for {0}
payout.scheduled.body="{0}" has ended. Your payout is scheduled for {1} (Almaty time).\n\n
payout.scheduled.footer=\n\nThe final amount is calculated on that day, after any refunds.
payout.rescheduled.title=Payout for {0} is scheduled again
payout.rescheduled.body=The hold on your payout for "{0}" was lifted. It is scheduled for {1} (Almaty time), currently estimated at {2} KZT.
payout.paid.title=Payout for {0} paid
payout.paid.body=Your payout for "{0}" was made to {1} ****{2}.\n\n
payout.paid.reference=\nReference: {0}
payout.held.title=Payout for {0} is on hold
payout.held.body=Your payout for "{0}" (about {1} KZT) is on hold.\n\nReason: {2}\n\nIf you have questions, open a support case.
payout.hold.NO_PAYOUT_ACCOUNT=No payout account is set up. Add one in your organizer profile and the payout is made automatically.
payout.hold.EVENT_SUSPENDED=The event is suspended by BiletFlow. The payout continues once the suspension is lifted.
payout.hold.ORGANIZER_SUSPENDED=The organizer's account is suspended. The payout continues once it is restored.
payout.cancelled.title=No payout for {0}
payout.cancelled.eventCancelled=The event was cancelled: its paid orders are refunded instead of paid out.
payout.cancelled.nothingToPay=Nothing to pay out: the event's paid orders were refunded.

