spring:
  application:
    name: backend-biletflow
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # "update" is OK for development only. Switch to "validate" + Flyway migrations before real data.
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  jwt:
    secret: ${JWT_SECRET}
    tokenExpiration: ${JWT_EXPIRATION_MS:86400000}   # milliseconds
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    enabled: ${SEED_DATA:false}

server:
  port: 8080
  # Correct http/https links in "Location" headers when running behind a reverse proxy later.
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
