# Describes the two programs that make up BiletFlow's backend:
#   db      = PostgreSQL database
#   backend = your Spring Boot app
# Start everything with:  docker compose up --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Almaty
    volumes:
      - pgdata:/var/lib/postgresql/data   # keeps your data when the container is removed
    ports:
      - "127.0.0.1:5432:5432"   # reachable from this machine only (DBeaver, IntelliJ, SSH tunnel)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # wait until the DB is really ready
    environment:
      # Inside Docker the DB hostname is the service name "db", NOT localhost.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (64+ characters)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DDL_AUTO: ${DDL_AUTO:-update}
      # Demo accounts with a publicly known password: opt in locally, never on a server.
      SEED_DATA: ${SEED_DATA:-false}
      # Behind Caddy: trust X-Forwarded-* so Location headers / Swagger use https and the real host.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      UPLOADS_DIR: /app/uploads
      # Base of the links in emails and campaign QR codes. Must be the https address on a server.
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      ACTIVATION_FEE_KZT: ${ACTIVATION_FEE_KZT:-5000}
      # simulated = no bank. halyk = Halyk ePay; the defaults below are its test environment.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulated}
      HALYK_CLIENT_ID: ${HALYK_CLIENT_ID:-}
      HALYK_CLIENT_SECRET: ${HALYK_CLIENT_SECRET:-}
      HALYK_TERMINAL_ID: ${HALYK_TERMINAL_ID:-}
      HALYK_CALLBACK_BASE_URL: ${HALYK_CALLBACK_BASE_URL:-}
      HALYK_TEST_MODE: ${HALYK_TEST_MODE:-true}
      HALYK_OAUTH_URL: ${HALYK_OAUTH_URL:-https://test-epay-oauth.epayment.kz/oauth2/token}
      HALYK_API_URL: ${HALYK_API_URL:-https://test-epay-api.epayment.kz}
      HALYK_SCRIPT_URL: ${HALYK_SCRIPT_URL:-https://test-epay.epayment.kz/payform/payment-api.js}
      # Off by default. For a local demo: COMPOSE_PROFILES=mail, MAIL_ENABLED=true, MAIL_HOST=mailpit
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@biletflow.kz}
    volumes:
      - uploads:/app/uploads   # event posters, kept across rebuilds
    ports:
      # This machine only, so a server is reached through Caddy (HTTPS), never plain HTTP.
      # Set BACKEND_BIND=0.0.0.0 in .env to test from a phone on the local network.
      - "${BACKEND_BIND:-127.0.0.1}:8080:8080"

  # Catches every email instead of delivering it: read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # HTTPS reverse proxy for a server with a domain. Gets certificates automatically.
  # Off by default (so local dev doesn't grab ports 80/443). On the server set in .env:
  #   COMPOSE_PROFILES=https   and   DOMAIN=yourname.duckdns.org   (ports 80 and 443 must be open)
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data   # keeps issued certificates across restarts
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
